[project]
name = "maxsor-ticket-assistant"
version = "0.1.0"
description = "AI support-ticket decision assistant: FastAPI, JWT, SQLite, CAG over policy docs, Gemini"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "litellm>=1.102.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
